<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#050714" />
  <title>LUCIA: NIGHT CITY</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="loading" class="screen">
    <div class="load-bg"></div>
    <div class="load-brand">LUCIA<span>:</span><br><b>NIGHT CITY</b></div>
    <div class="load-sub">A NEON OPEN-WORLD EXPERIENCE</div>
    <div class="load-bottom"><div class="load-status" id="loadStatus">ĐANG KHỞI TẠO THÀNH PHỐ...</div><div class="progress"><i id="progressBar"></i></div><div class="load-tip">KHÁM PHÁ • TỰ DO • BAN ĐÊM</div></div>
  </div>
  <div id="game" class="hidden">
    <canvas id="world"></canvas>
    <div class="topbar"><div class="brand-small">LUCIA <span>///</span> NIGHT CITY</div><div class="mission"><small>NHIỆM VỤ</small><b id="missionText">Khám phá khu phố neon</b></div><div class="clock">23:48 <span>●</span></div></div>
    <div class="hud-right"><canvas id="minimap" width="160" height="160"></canvas><div class="map-label">NIGHT DISTRICT</div></div>
    <div class="objective"><span class="dot"></span><span id="objectiveText">Đi đến điểm sáng gần nhất</span></div>
    <div class="touch-controls">
      <div id="joystick" class="joystick"><div class="joy-ring"></div><div id="stick" class="stick"></div></div>
      <div class="action-stack"><button id="runBtn" class="hud-btn">⚡<small>CHẠY</small></button><button id="interactBtn" class="hud-btn accent">✦<small>TƯƠNG TÁC</small></button></div>
    </div>
    <div id="toast" class="toast"></div>
    <div class="bottom-note">WASD / PHÍM MŨI TÊN ĐỂ DI CHUYỂN · KÉO JOYSTICK TRÊN MOBILE</div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
